<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- IA仕分け練習 (the portal edition) app icon: three labelled boxes and one card on its way into the
       middle one. Flat and calm, a tool rather than a game. Full-bleed (the OS applies the mask). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#dfe8f3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b2b4a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- three boxes, each with a coloured name tab and the lines of what it holds -->
  <g filter="url(#soft)">
    <rect x="212" y="186" width="600" height="176" rx="34" fill="#ffffff"/>
    <rect x="212" y="424" width="600" height="176" rx="34" fill="#ffffff"/>
    <rect x="212" y="662" width="600" height="176" rx="34" fill="#ffffff"/>
  </g>
  <g>
    <rect x="212" y="186" width="34" height="176" rx="17" fill="#1f9fc4"/>
    <rect x="212" y="424" width="34" height="176" rx="17" fill="#e39a12"/>
    <rect x="212" y="662" width="34" height="176" rx="17" fill="#d9573f"/>
    <rect x="290" y="228" width="210" height="40" rx="20" fill="#1f9fc4"/>
    <rect x="290" y="466" width="250" height="40" rx="20" fill="#e39a12"/>
    <rect x="290" y="704" width="180" height="40" rx="20" fill="#d9573f"/>
  </g>
  <g fill="#c3cfde">
    <rect x="290" y="296" width="150" height="26" rx="13"/>
    <rect x="456" y="296" width="120" height="26" rx="13"/>
    <rect x="592" y="296" width="150" height="26" rx="13"/>
    <rect x="290" y="534" width="130" height="26" rx="13"/>
    <rect x="290" y="772" width="150" height="26" rx="13"/>
    <rect x="456" y="772" width="130" height="26" rx="13"/>
  </g>

  <!-- the card being sorted, and where it is going -->
  <g filter="url(#soft)" transform="rotate(-8 660 540)">
    <rect x="560" y="486" width="220" height="92" rx="24" fill="#2b3a55"/>
    <rect x="596" y="520" width="148" height="24" rx="12" fill="#ffffff"/>
  </g>
  <path d="M470 547 h60" fill="none" stroke="#e39a12" stroke-width="16" stroke-linecap="round" stroke-dasharray="2 30"/>
</svg>
