<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- IA one-sheet icon: scattered information becomes a clear hierarchy. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102a57"/>
      <stop offset="1" stop-color="#050c1c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#eff9ff"/>
      <stop offset="1" stop-color="#b8dcf4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#66efff"/>
      <stop offset="1" stop-color="#3d91f3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="19" flood-color="#010716" flood-opacity=".7"/>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g opacity=".12" stroke="#8defff" stroke-width="3"><path d="M82 126H942M82 260H942M82 764H942M82 898H942"/><path d="M168 72V952M512 72V952M856 72V952"/></g>
  <!-- Input cards: unstructured pieces of information -->
  <g filter="url(#shadow)">
    <g transform="rotate(-9 253 285)"><rect x="121" y="195" width="264" height="172" rx="30" fill="url(#card)"/><rect x="158" y="240" width="128" height="17" rx="8.5" fill="#237bc3"/><rect x="158" y="282" width="177" height="14" rx="7" fill="#6a9fc8" opacity=".72"/><rect x="158" y="315" width="102" height="14" rx="7" fill="#6a9fc8" opacity=".5"/></g>
    <g transform="rotate(9 771 285)"><rect x="639" y="195" width="264" height="172" rx="30" fill="url(#card)"/><rect x="676" y="240" width="128" height="17" rx="8.5" fill="#f0715d"/><rect x="676" y="282" width="177" height="14" rx="7" fill="#6a9fc8" opacity=".72"/><rect x="676" y="315" width="102" height="14" rx="7" fill="#6a9fc8" opacity=".5"/></g>
  </g>
  <!-- The IA map: inputs meet, then branch into a legible structure. -->
  <g fill="none" stroke="#67eaff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".9" filter="url(#glow)"><path d="M284 398L430 502M740 398L594 502M512 614V680M240 810V772H784V810"/></g>
  <g filter="url(#shadow)"><rect x="375" y="485" width="274" height="164" rx="42" fill="url(#core)" stroke="#d8fbff" stroke-width="10"/><path d="M439 545H585M439 588H548" stroke="#092759" stroke-width="18" stroke-linecap="round" opacity=".85"/></g>
  <g filter="url(#shadow)"><rect x="124" y="790" width="232" height="126" rx="32" fill="#137a98" stroke="#8df6ff" stroke-width="8"/><rect x="396" y="790" width="232" height="126" rx="32" fill="#2767b6" stroke="#b9ddff" stroke-width="8"/><rect x="668" y="790" width="232" height="126" rx="32" fill="#744a9a" stroke="#e0bcff" stroke-width="8"/></g>
  <g fill="#e9fbff" opacity=".9"><rect x="176" y="839" width="128" height="14" rx="7"/><rect x="448" y="839" width="128" height="14" rx="7"/><rect x="720" y="839" width="128" height="14" rx="7"/></g>
  <circle cx="512" cy="502" r="18" fill="#fff3a4" filter="url(#glow)"/>
</svg>
